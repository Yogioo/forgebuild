<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0810">
<title>熔炉产线 · ForgeBuild</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#08070c;overflow:hidden;
    -webkit-tap-highlight-color:transparent;touch-action:none;
    font-family:-apple-system,"Segoe UI","Microsoft YaHei",Roboto,sans-serif}
  #stage{display:flex;align-items:center;justify-content:center;height:100%}
  #game{display:block;touch-action:none}
</style>
</head>
<body>
<div id="stage"><canvas id="game" width="420" height="740"></canvas></div>
<script>
/* ==== src/game.js ==== */
/* ==========================================================================
   ForgeBuild v0.2
   修四件事（对应玩家反馈）：
     1) 产线产出不再一次性消耗 → 变成给模块加经验，产量持续 = 成长持续
     2) 模块有等级 Lv1..Lv5，效果随等级变强
     3) 怪走到左边打基地，基地血归零就死 → 漏怪有代价，有输赢
     4) 战斗换成弓箭手 + 抛物线箭
   ========================================================================== */
(function (root) {
  "use strict";

  var W = 420, H = 740;
  var BATTLE_H = 330;
  var GRID_TOP = 372, CELL = 40, COLS = 5, ROWS = 4, GRID_X = 14;
  var PANEL_X = 232, BAR_H = 96;
  var BASE_X = 26;

  var MACHINES = {
    quench:  { nm: "淬火", mod: "double", col: "#ff9a5c" },
    grind:   { nm: "研磨", mod: "pierce", col: "#5cc8ff" },
    enchant: { nm: "附魔", mod: "aoe",    col: "#c58bff" },
    chill:   { nm: "霜缚", mod: "slow",   col: "#7fe3d8" },
    boost:   { nm: "加速", mod: "rapid",  col: "#ffd24a" }
  };

  var MOD = {
    double: { nm: "双发", col: "#ff9a5c", maxLv: 5, xp: function (lv) { return 4 + lv * 5; } },
    pierce: { nm: "穿透", col: "#5cc8ff", maxLv: 5, xp: function (lv) { return 5 + lv * 6; } },
    aoe:    { nm: "爆裂", col: "#c58bff", maxLv: 5, xp: function (lv) { return 6 + lv * 7; } },
    slow:   { nm: "霜缚", col: "#7fe3d8", maxLv: 5, xp: function (lv) { return 4 + lv * 5; } },
    rapid:  { nm: "速射", col: "#ffd24a", maxLv: 5, xp: function (lv) { return 4 + lv * 5; } }
  };

  var EMPTY = 0, MACH = 2, WALL = 3;

  /* 局外永久升级：每局都保留，这是"增量"的来源 */
  var META = {
    startLv: { nm: "起手模块等级", desc: "开局所有模块直接从 LvN 开始", max: 3, cost: function (n) { return 4 + n * 5; } },
    slots:   { nm: "产线机位",     desc: "可放置机器 +1", max: 4, cost: function (n) { return 4 + n * 5; } },
    hp:      { nm: "城墙加固",     desc: "基地血量 +60", max: 6, cost: function (n) { return 2 + n * 3; } },
    power:   { nm: "箭矢淬炼",     desc: "箭矢伤害 +18%", max: 12, cost: function (n) { return 2 + n * 3; } },
    speed:   { nm: "弓术精进",     desc: "射速 +12%", max: 10, cost: function (n) { return 2 + n * 3; } }
  };

  function loadMeta() {
    try {
      var raw = root.localStorage && root.localStorage.getItem("forgebuild_meta");
      if (raw) {
        var m = JSON.parse(raw);
        m.up = m.up || {};
        return m;
      }
    } catch (e) {}
    return { points: 0, up: {}, best: { wave: 1, kills: 0 } };
  }
  function saveMeta(m) {
    try { root.localStorage && root.localStorage.setItem("forgebuild_meta", JSON.stringify(m)); } catch (e) {}
  }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

  function Game(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext("2d");
    this.t = 0;

    this.grid = new Uint8Array(COLS * ROWS);
    this.machKind = new Array(COLS * ROWS).fill(null);
    this.ores = [];
    this.oreQueue = 0;
    this.spawnTimer = 0;
    this.selected = "quench";
    this.placedCount = 0;
    this.maxMachines = 6;

    this.meta = loadMeta();
    this.mods = {};
    for (var k in MOD) this.mods[k] = { lv: 0, xp: 0 };
    this.applyMeta();
    this.slots = ["double", "pierce", "rapid"];

    this.baseHp = 150; this.baseMaxHp = 150;
    this.archerX = BASE_X + 18; this.archerY = 190;
    this.enemies = [];
    this.arrows = [];
    this.parts = [];
    this.floats = [];
    this.motes = [];
    this.fireT = 0;
    this.wave = 1; this.waveT = 0;
    this.kills = 0; this.leaks = 0;
    this.oreTotal = 0;
    this.spawnT = 0;
    this.dead = false;
    this.gameOverT = 0;
    this.best = { wave: 1, kills: 0 };
  }

  Game.prototype.applyMeta = function () {
    var u = this.meta.up || {};
    var startLv = u.startLv || 0;
    for (var k in MOD) this.mods[k].lv = Math.min(startLv, MOD[k].maxLv);
    this.maxMachines = 6 + (u.slots || 0);
    this.baseMaxHp = 150 + (u.hp || 0) * 60;
    this.baseHp = this.baseMaxHp;
    this.powerMul = 1 + (u.power || 0) * 0.18;
    this.rateBonus = 1 + (u.speed || 0) * 0.12;
  };

  Game.prototype.metaLv = function (id) { return (this.meta.up && this.meta.up[id]) || 0; };
  Game.prototype.metaCost = function (id) { return META[id].cost(this.metaLv(id)); };
  Game.prototype.canBuy = function (id) {
    return this.metaLv(id) < META[id].max && this.meta.points >= this.metaCost(id);
  };
  Game.prototype.buyMeta = function (id) {
    if (!this.canBuy(id)) return false;
    this.meta.points -= this.metaCost(id);
    this.meta.up[id] = this.metaLv(id) + 1;
    saveMeta(this.meta);
    return true;
  };

  /* 死亡结算：撑得越久给的越多（这是"下一局更强"的燃料） */
  Game.prototype.awardPoints = function () {
    var pts = Math.max(2, Math.floor(this.wave) + Math.floor(this.kills / 28));
    this.meta.points += pts;
    this.meta.best.wave = Math.max(this.meta.best.wave || 1, this.wave);
    this.meta.best.kills = Math.max(this.meta.best.kills || 0, this.kills);
    saveMeta(this.meta);
    this.lastAward = pts;
    return pts;
  };

  Game.prototype.modLv = function (m) { return this.mods[m] ? this.mods[m].lv : 0; };

  Game.prototype.weapon = function () {
    var w = {
      shots: 1 + Math.floor(this.modLv("double") * 0.7),
      pierce: this.modLv("pierce"),
      aoe: this.modLv("aoe") > 0 ? 26 + this.modLv("aoe") * 9 : 0,
      slow: this.modLv("slow") * 0.12,
      rateMul: 1 + this.modLv("rapid") * 0.22,
      active: {}
    };
    for (var i = 0; i < this.slots.length; i++) w.active[this.slots[i]] = true;
    if (!w.active.double) w.shots = 1;
    if (!w.active.pierce) w.pierce = 0;
    if (!w.active.aoe) w.aoe = 0;
    if (!w.active.slow) w.slow = 0;
    if (!w.active.rapid) w.rateMul = 1;
    return w;
  };

  Game.prototype.spawnEnemy = function () {
    var hp = 20 * Math.pow(1.36, this.wave - 1);
    this.enemies.push({
      x: W + 30 + Math.random() * 50,
      y: 80 + Math.random() * (BATTLE_H - 160),
      hp: hp, maxHp: hp,
      r: 10 + Math.random() * 4,
      spd: 13 + Math.random() * 9 + this.wave * 0.5,
      slowT: 0, hitT: 0,
      dmg: 3 + this.wave * 1.45
    });
  };

  Game.prototype.nearest = function (x, y, skip) {
    var best = null, bd = 1e9;
    for (var i = 0; i < this.enemies.length; i++) {
      var e = this.enemies[i];
      if (e.hp <= 0) continue;
      if (skip && skip.indexOf(e) >= 0) continue;
      var d = (e.x - x) * (e.x - x) + (e.y - y) * (e.y - y);
      if (d < bd) { bd = d; best = e; }
    }
    return best;
  };

  Game.prototype.shootAt = function (tx, ty, dmg, pierceLeft) {
    var g = 900;
    var T = clamp(Math.hypot(tx - this.archerX, ty - this.archerY) / 520, 0.32, 0.72);
    var vx = (tx - this.archerX) / T;
    var vy = (ty - this.archerY - 0.5 * g * T * T) / T;
    this.arrows.push({
      x: this.archerX + 6, y: this.archerY - 6, vx: vx, vy: vy,
      dmg: dmg, pierceLeft: pierceLeft || 0, hitSet: [], life: 3, ang: 0, trail: []
    });
  };

  Game.prototype.damage = function (e, amount, depth) {
    if (e.hp <= 0) return;
    e.hp -= amount;
    e.hitT = 0.12;
    var w = this.weapon();
    if (w.aoe > 0 && depth === 0) {
      for (var i = 0; i < this.enemies.length; i++) {
        var o = this.enemies[i];
        if (o === e || o.hp <= 0) continue;
        if (Math.hypot(o.x - e.x, o.y - e.y) < w.aoe) this.damage(o, amount * 0.45, 1);
      }
    }
    if (w.slow > 0) e.slowT = 1.4;
    if (e.hp <= 0) {
      this.kills++;
      this.oreQueue++;
      this.oreTotal++;
      this.motes.push({ x: e.x, y: e.y, t: 0, sx: e.x, sy: e.y });
      this.burst(e.x, e.y, 7, "#ffd24a");
      this.floats.push({ x: e.x, y: e.y - 8, txt: "+1矿", col: "#ffd24a", life: 0.8, max: 0.8 });
    }
  };

  Game.prototype.idx = function (x, y) { return y * COLS + x; };
  Game.prototype.cellAt = function (px, py) {
    var gx = Math.floor((px - GRID_X) / CELL), gy = Math.floor((py - GRID_TOP) / CELL);
    if (gx < 0 || gx >= COLS || gy < 0 || gy >= ROWS) return null;
    return { x: gx, y: gy };
  };

  Game.prototype.placeMachine = function (gx, gy) {
    var i = this.idx(gx, gy);
    if (this.grid[i] === MACH) { this.grid[i] = EMPTY; this.machKind[i] = null; this.placedCount--; return "removed"; }
    if (this.grid[i] !== EMPTY) return false;
    if (this.placedCount >= this.maxMachines) return false;
    this.grid[i] = MACH; this.machKind[i] = this.selected; this.placedCount++;
    return "placed";
  };

  Game.prototype.feedOre = function (dt) {
    this.spawnTimer -= dt;
    if (this.spawnTimer <= 0 && this.oreQueue > 0) {
      this.spawnTimer = 0.34;
      this.oreQueue--;
      this.ores.push({ gx: Math.floor(Math.random() * COLS), gy: -1, tag: null, vy: 0, acc: 0 });
    }
    for (var i = this.ores.length - 1; i >= 0; i--) {
      var o = this.ores[i];
      o.vy = Math.min(o.vy + dt * 7, 3.2);
      o.acc += o.vy * dt * 3;
      while (o.acc >= 1) {
        o.acc -= 1;
        var ny = o.gy + 1;
        if (ny >= ROWS) { this.gainXp(o.tag); this.ores.splice(i, 1); break; }
        var ci = this.idx(o.gx, ny);
        if (this.grid[ci] === MACH) o.tag = MACHINES[this.machKind[ci]].mod;
        else if (this.grid[ci] === WALL) { this.ores.splice(i, 1); break; }
        o.gy = ny;
      }
    }
  };

  Game.prototype.gainXp = function (tag) {
    var fx = GRID_X + COLS * CELL / 2, fy = GRID_TOP + ROWS * CELL + 18;
    if (!tag) {
      this.floats.push({ x: fx, y: fy, txt: "废料（这一列没机器）", col: "#7c8899", life: 0.9, max: 0.9 });
      return;
    }
    var m = this.mods[tag];
    if (m.lv >= MOD[tag].maxLv) {
      this.floats.push({ x: fx, y: fy, txt: MOD[tag].nm + " 已满级", col: MOD[tag].col, life: 0.7, max: 0.7 });
      return;
    }
    m.xp++;
    var need = MOD[tag].xp(m.lv);
    if (m.xp >= need) {
      m.xp -= need; m.lv++;
      this.floats.push({ x: fx, y: fy, txt: MOD[tag].nm + " → Lv" + m.lv, col: MOD[tag].col, life: 1.2, max: 1.2 });
      this.burst(W / 2, GRID_TOP + 24, 16, MOD[tag].col);
    }
  };

  Game.prototype.update = function (dt) {
    this.t += dt;

    if (this.dead) { this.gameOverT += dt; return; }

    var w = this.weapon();

    this.waveT += dt;
    if (this.waveT > 24) { this.waveT = 0; this.wave++; }

    this.spawnT -= dt;
    if (this.spawnT <= 0) {
      this.spawnT = Math.max(0.42, 1.6 - this.wave * 0.09);
      this.spawnEnemy();
    }

    for (var i = this.enemies.length - 1; i >= 0; i--) {
      var e = this.enemies[i];
      e.hitT = Math.max(0, e.hitT - dt);
      var sp = e.spd * (e.slowT > 0 ? (1 - w.slow) : 1);
      if (e.slowT > 0) e.slowT -= dt;
      e.x -= sp * dt;

      if (e.x < BASE_X + 34) {
        this.baseHp -= e.dmg;
        this.leaks++;
        this.burst(BASE_X, e.y, 12, "#ff5c6e");
        this.floats.push({ x: BASE_X + 26, y: e.y, txt: "-" + Math.round(e.dmg), col: "#ff5c6e", life: 0.9, max: 0.9 });
        this.enemies.splice(i, 1);
        if (this.baseHp <= 0) {
          this.baseHp = 0; this.dead = true;
          this.best.wave = Math.max(this.best.wave, this.wave);
          this.best.kills = Math.max(this.best.kills, this.kills);
          this.awardPoints();
        }
        continue;
      }
      if (e.hp <= 0) this.enemies.splice(i, 1);
    }

    this.fireT -= dt;
    if (this.fireT <= 0) {
      var tg = this.nearest(this.archerX, this.archerY);
      if (tg) {
        this.fireT = 0.55 / (w.rateMul * (this.rateBonus || 1));
        var n = w.shots;
        for (var s = 0; s < n; s++) {
          var spread = (s - (n - 1) / 2) * 18;
          this.shootAt(tg.x, tg.y + spread, (14 + this.wave * 1.1) * (this.powerMul || 1), w.pierce);
        }
      }
    }

    var g = 900;
    for (var a = this.arrows.length - 1; a >= 0; a--) {
      var ar = this.arrows[a];
      ar.life -= dt;
      ar.vy += g * dt;
      ar.x += ar.vx * dt;
      ar.y += ar.vy * dt;
      ar.ang = Math.atan2(ar.vy, ar.vx);
      ar.trail.push([ar.x, ar.y]);
      if (ar.trail.length > 7) ar.trail.shift();

      if (ar.life <= 0 || ar.x < -20 || ar.x > W + 40 || ar.y > BATTLE_H - 6) {
        this.arrows.splice(a, 1);
        continue;
      }
      var hit = false;
      for (var k = 0; k < this.enemies.length; k++) {
        var en = this.enemies[k];
        if (en.hp <= 0 || ar.hitSet.indexOf(en) >= 0) continue;
        if (Math.hypot(en.x - ar.x, en.y - ar.y) < en.r + 5) {
          this.damage(en, ar.dmg, 0);
          ar.hitSet.push(en);
          this.burst(ar.x, ar.y, 4, "#ffe9a8");
          if (ar.pierceLeft > 0) ar.pierceLeft--;
          else { this.arrows.splice(a, 1); }
          hit = true;
          break;
        }
      }
      if (hit) continue;
    }

    for (var p = this.parts.length - 1; p >= 0; p--) {
      var q = this.parts[p];
      q.life -= dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 260 * dt;
      if (q.life <= 0) this.parts.splice(p, 1);
    }
    for (var f = this.floats.length - 1; f >= 0; f--) {
      var o2 = this.floats[f];
      o2.life -= dt; o2.y -= dt * 30;
      if (o2.life <= 0) this.floats.splice(f, 1);
    }
    for (var mi = this.motes.length - 1; mi >= 0; mi--) {
      this.motes[mi].t += dt * 1.4;
      if (this.motes[mi].t >= 1) this.motes.splice(mi, 1);
    }

    this.feedOre(dt);
  };

  Game.prototype.burst = function (x, y, n, col) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * 6.283, s = 40 + Math.random() * 130;
      this.parts.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.4 + Math.random() * 0.35, max: 0.75, r: 1.4 + Math.random() * 1.8, c: col });
    }
  };

  Game.prototype.restart = function () {
    this.t = 0;
    this.grid = new Uint8Array(COLS * ROWS);
    this.machKind = new Array(COLS * ROWS).fill(null);
    this.ores = []; this.oreQueue = 0; this.spawnTimer = 0; this.placedCount = 0;
    for (var k in MOD) this.mods[k] = { lv: 0, xp: 0 };
    this.slots = ["double", "pierce", "rapid"];
    this.applyMeta();          // 局外升级在每局开始时生效
    this.enemies = []; this.arrows = []; this.parts = []; this.floats = []; this.motes = [];
    this.fireT = 0; this.wave = 1; this.waveT = 0;
    this.kills = 0; this.leaks = 0; this.spawnT = 0; this.oreTotal = 0;
    this.dead = false; this.gameOverT = 0;
  };

  root.ForgeGame = {
    Game: Game, MACHINES: MACHINES, MOD: MOD, META: META,
    C: { W: W, H: H, BATTLE_H: BATTLE_H, GRID_TOP: GRID_TOP, CELL: CELL, COLS: COLS, ROWS: ROWS, GRID_X: GRID_X, PANEL_X: PANEL_X, BAR_H: BAR_H, BASE_X: BASE_X }
  };
})(typeof window !== "undefined" ? window : globalThis);

/* ==== src/render.js ==== */
/* ForgeBuild v0.2 · 渲染 */
(function (root) {
  "use strict";
  var G = root.ForgeGame, C = G.C;
  var W = C.W, H = C.H, BATTLE_H = C.BATTLE_H, GRID_TOP = C.GRID_TOP;
  var CELL = C.CELL, COLS = C.COLS, ROWS = C.ROWS, GRID_X = C.GRID_X;
  var PANEL_X = C.PANEL_X, BAR_H = C.BAR_H, BASE_X = C.BASE_X;

  function rr(g, x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r);
    g.closePath();
  }
  function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }

  G.machRects = function () {
    var keys = Object.keys(G.MACHINES), n = keys.length, gap = 6;
    var w = (W - 24 - gap * (n - 1)) / n;
    return keys.map(function (k, i) { return { id: k, x: 12 + i * (w + gap), y: H - BAR_H + 40, w: w, h: 46 }; });
  };

  G.metaRects = function () {
    var ids = Object.keys(G.META);
    return ids.map(function (k, i) {
      return { id: k, x: 26, y: 236 + i * 54, w: W - 52, h: 46 };
    });
  };

  G.startRect = function () { return { x: W / 2 - 84, y: H - 96, w: 168, h: 54 }; };

  G.modRects = function () {
    var keys = Object.keys(G.MOD);
    return keys.map(function (k, i) { return { id: k, x: PANEL_X, y: 396 + i * 36, w: 174, h: 32 }; });
  };

  G.Game.prototype.draw = function () {
    var g = this.ctx;
    g.clearRect(0, 0, W, H);

    /* ===== 战斗区 ===== */
    var sky = g.createLinearGradient(0, 0, 0, BATTLE_H);
    sky.addColorStop(0, "#1b2230");
    sky.addColorStop(0.55, "#131a24");
    sky.addColorStop(1, "#0c1017");
    g.fillStyle = sky;
    g.fillRect(0, 0, W, BATTLE_H);

    // 远景山
    g.fillStyle = "rgba(80,110,150,0.10)";
    g.beginPath();
    g.moveTo(0, BATTLE_H - 40);
    for (var mx = 0; mx <= W; mx += 40) {
      g.lineTo(mx, BATTLE_H - 40 - (Math.sin(mx * 0.03) * 16 + 18));
    }
    g.lineTo(W, BATTLE_H); g.lineTo(0, BATTLE_H);
    g.closePath(); g.fill();

    // 地面
    var gr = g.createLinearGradient(0, BATTLE_H - 34, 0, BATTLE_H);
    gr.addColorStop(0, "rgba(120,160,200,0.10)");
    gr.addColorStop(1, "rgba(60,90,130,0.02)");
    g.fillStyle = gr;
    g.fillRect(0, BATTLE_H - 34, W, 34);

    // 基地：砖墙 + 城垛
    var wallY = 92, wallH = BATTLE_H - 128;
    g.fillStyle = "#2a3341";
    g.fillRect(4, wallY, 28, wallH);
    g.fillStyle = "rgba(255,255,255,0.05)";
    for (var by = 0; by < wallH; by += 14) {
      g.fillRect(4, wallY + by, 28, 1);
      g.fillRect(4 + ((by / 14) % 2 ? 9 : 20), wallY + by, 1, 14);
    }
    // 城垛
    for (var cy2 = 0; cy2 < 28; cy2 += 14) {
      g.fillStyle = "#333e4e";
      g.fillRect(4 + cy2, wallY - 12, 12, 12);
    }
    g.strokeStyle = "rgba(140,180,220,0.25)";

  "use strict";
  var G = root.ForgeGame, C = G.C;
  var W = C.W, H = C.H;

  var game = null, last = 0;

  function boot() {
    var canvas = root.document.getElementById("game");
    game = new G.Game(canvas);
    fit(canvas);
    root.addEventListener("resize", function () { fit(canvas); });
    canvas.addEventListener("pointerdown", onDown);
    last = Date.now();
    loop();
  }

  function fit(canvas) {
    var vw = root.innerWidth || W, vh = root.innerHeight || H;
    var s = Math.min(vw / W, vh / H);
    canvas.style.width = Math.round(W * s) + "px";
    canvas.style.height = Math.round(H * s) + "px";
    canvas._rect = null;
  }

  function toLocal(e) {
    var cv = root.document.getElementById("game");
    if (!cv._rect) cv._rect = cv.getBoundingClientRect();
    var r = cv._rect;
    return { x: (e.clientX - r.left) / (r.width / W), y: (e.clientY - r.top) / (r.height / H) };
  }

  function onDown(e) {
    e.preventDefault();
    var p = toLocal(e);

    if (game.dead) {
      var mrs = G.metaRects();
      for (var i0 = 0; i0 < mrs.length; i0++) {
        var mr = mrs[i0];
        if (p.x >= mr.x && p.x <= mr.x + mr.w && p.y >= mr.y && p.y <= mr.y + mr.h) {
          game.buyMeta(mr.id);
          return;
        }
      }
      var sr = G.startRect();
      if (p.x >= sr.x && p.x <= sr.x + sr.w && p.y >= sr.y && p.y <= sr.y + sr.h) game.restart();
      return;
    }

    var mr = G.machRects();
    for (var i = 0; i < mr.length; i++) {
      var b = mr[i];
      if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) { game.selected = b.id; return; }
    }

    var mods = G.modRects();
    for (var m = 0; m < mods.length; m++) {
      var r = mods[m];
      if (p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h) {
        var idx = game.slots.indexOf(r.id);
        if (idx >= 0) game.slots.splice(idx, 1);
        else {
          game.slots.push(r.id);
          if (game.slots.length > 3) game.slots.shift();
        }
        return;
      }
    }

    var cell = game.cellAt(p.x, p.y);
    if (cell) game.placeMachine(cell.x, cell.y);
  }

  function loop() {
    var now = Date.now();
    var dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    game.update(dt);
    game.draw();
    root.requestAnimationFrame(loop);
  }

  root.API = {
    g: function () { return game; },
    step: function (n, dt) {
      dt = dt || 1 / 60;
      for (var i = 0; i < (n || 1); i++) game.update(dt);
      game.draw();
      return this.info();
    },
    place: function (x, y, kind) { if (kind) game.selected = kind; return game.placeMachine(x, y); },
    info: function () {
      var lv = {};
      for (var k in game.mods) lv[k] = game.mods[k].lv;
      return {
        t: Math.round(game.t * 10) / 10,
        wave: game.wave, kills: game.kills, leaks: game.leaks,
        baseHp: Math.round(game.baseHp), dead: game.dead,
        levels: lv, slots: game.slots.slice(),
        ores: game.ores.length, queue: game.oreQueue,
        machines: game.placedCount, arrows: game.arrows.length, enemies: game.enemies.length,
        points: Math.floor(game.meta.points), metaUp: game.meta.up, maxMachines: game.maxMachines,
        maxHp: game.baseMaxHp, powerMul: game.powerMul
      };
    }
  };

  if (root.document.readyState === "loading") {
    root.document.addEventListener("DOMContentLoaded", boot);
  } else boot();
})(typeof window !== "undefined" ? window : globalThis);

</script>
</body>
</html>
